version: "3.8"

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: brewlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewlite_user} -d ${POSTGRES_DB:-brewlite_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brewlite-network

  # 2. NestJS Backend API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite_user}:${POSTGRES_PASSWORD:-brewlite_secret_password}@postgres:5432/${POSTGRES_DB:-brewlite_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-brewlite_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      VNP_URL: ${VNP_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:3000/payment/vnpay-return}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brewlite-network

  # 3. Next.js Frontend Web Service
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: brewlite-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - api
    networks:
      - brewlite-network

volumes:
  postgres_data:
    name: brewlite_postgres_data

networks:
  brewlite-network:
    name: brewlite_network
    driver: bridge
