databases:
  - name: brewlite-db
    databaseName: brewlite_db
    user: brewlite_user
    plan: free
    ipAllowList: []

services:
  - type: web
    name: brewlite-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    # Dùng /api/v1/promotions (kiểm tra cả API + PostgreSQL); có thể đổi sang /api/v1/health sau khi PR của Hiệp merge
    healthCheckPath: /api/v1/promotions
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brewlite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3001"
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_MOCK_DELAY_MS
        value: "1500"
      - key: PAYMENT_MOCK_FAILURE_RATE
        value: "0"
      - key: LOYALTY_POINT_RATE
        value: "10000"
      - key: LOYALTY_REDEEM_RATE
        value: "1000"
